<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Saucisson</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saucisson">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>Saucisson</h1>
  <div class="topbar-actions">
    <button id="btn-undo" class="icon-btn" aria-label="Annuler la dernière action" disabled>
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="btn-settings" class="icon-btn" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="hero">
    <button id="btn-slice" class="slice-btn" aria-label="Ajouter une tranche">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="92" fill="#e9e1d4"/>
        <circle cx="100" cy="100" r="84" fill="#8e2230"/>
        <g fill="#f3e7d6">
          <circle cx="70" cy="62" r="9"/><circle cx="118" cy="52" r="7"/><circle cx="142" cy="88" r="10"/>
          <circle cx="60" cy="108" r="8"/><circle cx="100" cy="96" r="6"/><circle cx="128" cy="130" r="8"/>
          <circle cx="84" cy="140" r="9"/><circle cx="48" cy="80" r="5"/><circle cx="152" cy="120" r="5"/>
          <circle cx="104" cy="160" r="5"/><circle cx="92" cy="70" r="4"/><circle cx="116" cy="108" r="4"/>
        </g>
        <g fill="#2a0f12"><circle cx="82" cy="88" r="2.2"/><circle cx="130" cy="72" r="2.2"/><circle cx="74" cy="124" r="2.2"/><circle cx="140" cy="108" r="2.2"/><circle cx="108" cy="140" r="2.2"/><circle cx="100" cy="120" r="2"/></g>
      </svg>
      <span class="slice-count" id="total">0</span>
    </button>
    <p class="hero-label"><span id="total-label">tranche</span> pour <span id="target-name">—</span> · tape la rondelle</p>
  </section>

  <section class="gauge-card">
    <div class="gauge-head">
      <span>Saucissons</span>
      <strong id="saucissons">0</strong>
    </div>
    <div class="sausage" aria-hidden="true">
      <div class="sausage-body"><div class="sausage-eaten" id="eaten"></div></div>
      <div class="sausage-string"></div>
    </div>
    <p class="gauge-foot" id="gauge-foot">0 tranche · saucisson n°1 : 0/25</p>
  </section>

  <section class="people">
    <div class="section-head">
      <h2>Convives</h2>
      <button id="btn-add-person" class="text-btn">+ Ajouter</button>
    </div>
    <ul id="people-list"></ul>
  </section>

  <section class="history">
    <div class="section-head">
      <h2>Soirées précédentes</h2>
      <button id="btn-new-session" class="text-btn accent">Nouvelle soirée</button>
    </div>
    <ul id="history-list"></ul>
    <p id="history-empty" class="muted">Aucune soirée archivée pour l'instant.</p>
  </section>
</main>

<dialog id="dlg-settings">
  <form method="dialog">
    <h2>Réglages</h2>
    <label>Tranches par saucisson
      <input type="number" id="in-per-sausage" min="1" max="500" inputmode="numeric">
    </label>
    <p class="muted small">Un saucisson sec classique (~250 g) donne environ 25 tranches fines.</p>
    <div class="dlg-actions">
      <button value="cancel" class="text-btn">Annuler</button>
      <button value="ok" class="primary-btn">Enregistrer</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-person">
  <form method="dialog">
    <h2 id="dlg-person-title">Nouveau convive</h2>
    <label>Prénom
      <input type="text" id="in-person-name" maxlength="30" autocomplete="off">
    </label>
    <div class="dlg-actions">
      <button value="delete" id="btn-delete-person" class="text-btn danger">Supprimer</button>
      <span class="spacer"></span>
      <button value="cancel" class="text-btn">Annuler</button>
      <button value="ok" class="primary-btn">OK</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
